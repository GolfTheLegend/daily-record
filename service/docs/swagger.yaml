basePath: /api/v1
definitions:
  handlers.CreateDailyRecordRequest:
    properties:
      activity_detail:
        type: string
      activity_header:
        type: string
      dates:
        description: ใช้ตอน repeat_type = 1
        items:
          type: string
        type: array
      end_time:
        type: string
      icon_id:
        type: integer
      important:
        type: boolean
      repeat_type:
        type: integer
      start_time:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@dailyrecord.com
    name: API Support
  description: Daily Record API for tracking daily activities
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: Daily Record API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login ด้วย username และ password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout โดย revoke refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout user
      tags:
      - Authentication
  /auth/logout-all:
    post:
      description: Logout จากทุกอุปกรณ์
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout all sessions
      tags:
      - Authentication
  /auth/me:
    get:
      description: ดูข้อมูล user ปัจจุบัน
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: ใช้ refresh token เพื่อออก access token ใหม่
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: สร้างบัญชีผู้ใช้ใหม่ด้วยชื่อผู้ใช้ อีเมล และรหัสผ่าน
      parameters:
      - description: ข้อมูลการลงทะเบียน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: ลงทะเบียนสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
      summary: ลงทะเบียนผู้ใช้ใหม่
      tags:
      - Authentication
  /daily-records:
    get:
      consumes:
      - application/json
      description: Get all daily records for a user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Daily-Records
      tags:
      - Daily Records
    post:
      consumes:
      - application/json
      description: Create a new daily record
      parameters:
      - description: Daily record details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDailyRecordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create Daily-Record
      tags:
      - Daily Records
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
