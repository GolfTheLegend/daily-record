basePath: /api/v1
definitions:
  handlers.CreateDailyRecordRequest:
    properties:
      activity_detail:
        type: string
      activity_header:
        type: string
      dates:
        description: ใช้ตอน repeat_type = 1
        items:
          type: string
        type: array
      end_time:
        type: string
      icon_id:
        type: integer
      important:
        type: boolean
      repeat_type:
        type: integer
      start_time:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  handlers.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  handlers.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  models.CreateDailyCheckListRequest:
    properties:
      check_status:
        description: optional
        type: boolean
      day_check:
        description: 'format: YYYY-MM-DD'
        type: string
    type: object
  models.DailyCheckList:
    properties:
      check_status:
        type: boolean
      created_at:
        type: string
      day_check:
        type: string
      id:
        type: integer
      main_record_id:
        type: integer
      updated_at:
        type: string
    type: object
  models.DailyRecordDetailResponse:
    properties:
      data:
        $ref: '#/definitions/models.DailyRecordResponse'
      success:
        type: boolean
    type: object
  models.DailyRecordResponse:
    properties:
      activity_detail:
        type: string
      activity_header:
        type: string
      check_status:
        type: boolean
      dates:
        items:
          type: string
        type: array
      end_time:
        type: string
      icon_id:
        type: integer
      id:
        type: integer
      important:
        type: boolean
      repeat_type:
        type: integer
      start_time:
        type: string
    type: object
  models.DailyRecordStatusResponse:
    properties:
      day:
        type: integer
      has_record:
        type: boolean
      important:
        type: boolean
      month:
        type: integer
      year:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
      success:
        type: boolean
    type: object
  models.UpdateCheckListRequest:
    properties:
      check_status:
        type: boolean
    type: object
  models.UpdateDailyRecordRequest:
    properties:
      activity_detail:
        type: string
      activity_header:
        type: string
      dates:
        description: '"YYYY-MM-DD"'
        items:
          type: string
        type: array
      end_time:
        description: '"HH:MM"'
        type: string
      icon_id:
        type: integer
      important:
        type: boolean
      repeat_type:
        type: integer
      start_time:
        description: '"HH:MM"'
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: integer
      role:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@dailyrecord.com
    name: API Support
  description: Daily Record API for tracking daily activities
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://example.com/terms/
  title: Daily Record API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login ด้วย username และ password
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login user
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout โดย revoke refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout user
      tags:
      - Authentication
  /auth/logout-all:
    post:
      description: Logout จากทุกอุปกรณ์
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Logout all sessions
      tags:
      - Authentication
  /auth/me:
    get:
      description: ดูข้อมูล user ปัจจุบัน
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: ใช้ refresh token เพื่อออก access token ใหม่
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Refresh access token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: สร้างบัญชีผู้ใช้ใหม่ด้วยชื่อผู้ใช้ อีเมล และรหัสผ่าน
      parameters:
      - description: ข้อมูลการลงทะเบียน
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: ลงทะเบียนสำเร็จ
          schema:
            additionalProperties: true
            type: object
        "400":
          description: ข้อมูลไม่ถูกต้อง
          schema:
            additionalProperties: true
            type: object
      summary: ลงทะเบียนผู้ใช้ใหม่
      tags:
      - Authentication
  /daily-records:
    get:
      consumes:
      - application/json
      description: Get all daily records for a user with optional filters
      parameters:
      - description: Filter from date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Filter to date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Filter by repeat type
        in: query
        name: repeat_type
        type: integer
      - description: Filter by important flag
        in: query
        name: important
        type: boolean
      - description: Search by activity header (partial match)
        in: query
        name: activity_header
        type: string
      - description: 'Number of records per page (default: 20, max: 100)'
        in: query
        name: limit
        type: integer
      - description: 'Number of records to skip (default: 0)'
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.DailyRecordResponse'
                type: array
              success:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Get Daily Records
      tags:
      - Daily Records
    post:
      consumes:
      - application/json
      description: Create a new daily record
      parameters:
      - description: Daily record details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateDailyRecordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.DailyRecordResponse'
                type: array
              success:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Create Daily-Record
      tags:
      - Daily Records
  /daily-records/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a daily record by ID (related days are removed automatically)
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete Daily Record
      tags:
      - Daily Records
    get:
      consumes:
      - application/json
      description: Get a single daily record by ID
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DailyRecordDetailResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get Daily Record by ID
      tags:
      - Daily Records
    put:
      consumes:
      - application/json
      description: Update an existing daily record and its dates by ID
      parameters:
      - description: Record ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated record details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateDailyRecordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update Daily Record
      tags:
      - Daily Records
  /daily-records/check-list/{id}:
    post:
      consumes:
      - application/json
      description: Create a new daily check list
      parameters:
      - description: Daily Record ID
        in: path
        name: id
        required: true
        type: integer
      - description: Daily check list details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateDailyCheckListRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/models.DailyCheckList'
              success:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Create Daily Check List
      tags:
      - Daily Check Lists
    put:
      consumes:
      - application/json
      description: Update an existing daily check list
      parameters:
      - description: Daily Record ID
        in: path
        name: id
        required: true
        type: integer
      - description: Daily check list details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateCheckListRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                $ref: '#/definitions/models.DailyCheckList'
              success:
                type: boolean
            type: object
        "201":
          description: Created
          schema:
            properties:
              data:
                $ref: '#/definitions/models.DailyCheckList'
              success:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Update Daily Check List
      tags:
      - Daily Check Lists
  /daily-records/status:
    get:
      consumes:
      - application/json
      description: Get status of daily records for a user filtered by date, month,
        or year
      parameters:
      - description: Filter by day (1-31)
        in: query
        name: day
        type: integer
      - description: Filter by month (1-12)
        in: query
        name: month
        type: integer
      - description: Filter by year (e.g. 2025)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            properties:
              data:
                items:
                  $ref: '#/definitions/models.DailyRecordStatusResponse'
                type: array
              success:
                type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
        "500":
          description: Internal Server Error
          schema:
            properties:
              error:
                type: string
              success:
                type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Get Status Daily Records
      tags:
      - Daily Records
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
